[project]
name = "opencodex-lite"
version = "2.99.0"
description = "Personal Windows local model gateway"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "tomlkit>=0.13",
    "anyio>=4",
    "ruamel-yaml>=0.19.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

[project.scripts]
ocx = "ocx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ocx"]

[dependency-groups]
dev = ["ruff==0.17.5"]

[tool.uv]
required-version = ">=0.13.8"
