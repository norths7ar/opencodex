[project]
name = "opencodex-lite"
version = "2.99.0"
description = "Personal Windows local model gateway"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.162.2", "uvicorn>=0.54.0"]

[project.scripts]
ocx = "ocx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ocx"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py314"
line-length = 100
